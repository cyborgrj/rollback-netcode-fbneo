# Nginx do Frame Perfect, na mesma Lightsail que roda o lobby.
#
# O DNS nao resolve porta: frameperfect.net aponta para o IP da maquina, e e
# aqui dentro que o trafego se separa. Por isso tudo entra em 80/443 e sai para
# a porta local certa.
#
#   /usr/share/nginx/frameperfect   arquivos do React (npm run build)
#   127.0.0.1:8000                  Django via gunicorn
#   127.0.0.1:50051                 lobby .NET (gRPC, nao passa por aqui)
#
# Depois de copiar:
#   sudo ln -s /etc/nginx/sites-available/frameperfect /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d frameperfect.net -d www.frameperfect.net

server {
    listen 80;
    listen [::]:80;
    server_name frameperfect.net www.frameperfect.net;

    # O Certbot reescreve isto para redirecionar 80 -> 443 e adiciona os
    # certificados. Ate rodar o certbot, o site responde em HTTP mesmo.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 8m;

    # ---- o site (React ja compilado) ------------------------------------
    # O React nao "roda" no servidor: o build vira HTML, CSS e JS estaticos e o
    # Nginx entrega direto. try_files manda tudo que nao e arquivo para o
    # index.html, que e como uma SPA sobrevive a alguem digitar /perfil na barra
    # de enderecos.
    root /usr/share/nginx/frameperfect;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|glb)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- a API ------------------------------------------------------------
    location /api/ {
        # As rotas internas so existem para o .NET, que fala de dentro da
        # maquina. Fechar aqui tambem e a segunda barreira: a primeira e a
        # API key, e a terceira e o proprio Django conferir o REMOTE_ADDR.
        location /api/internal/ { deny all; }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/  { alias /home/ubuntu/frameperfect/backend/media/; }
    location /static/ { alias /home/ubuntu/frameperfect/backend/staticfiles/; }
}
