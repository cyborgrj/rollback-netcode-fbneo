syntax = "proto3";

package rbf.v1;
option csharp_namespace = "Rbf.Protocol";

// One long-lived bidirectional stream per connected client.
// The client's FIRST message must be Hello; the server replies Welcome or
// LoginRejected and then streams Roster / challenge / match events.
service Lobby {
  rpc Connect(stream ClientMsg) returns (stream ServerMsg);
}

// ---------------------------------------------------------------------------
// client -> server
// ---------------------------------------------------------------------------
message ClientMsg {
  oneof kind {
    Hello          hello           = 1;
    JoinRoom       join_room       = 2;
    LeaveRoom      leave_room      = 3;
    Challenge      challenge       = 4;
    ChallengeReply challenge_reply = 5;
    MatchStatus    match_status    = 6;
    Ping           ping            = 7;
    ChatSend       chat            = 8;
  }
}

message Hello {
  string username   = 1;
  string client_ver = 2;
  string lan_ip     = 3;   // the client's own LAN IPv4 - used as peer_ip for matches
                           // (more reliable than the address the server sees through NAT)
}

message JoinRoom  { string game = 1; }   // FBNeo short name, e.g. "sfa2"
message LeaveRoom { }

// frame_delay is what THIS side wants; the server averages the two.
message Challenge      { string target_user_id = 1; int32 frame_delay = 2; }
message ChallengeReply { string challenge_id = 1; bool accept = 2; int32 frame_delay = 3; }

message MatchStatus {
  string match_id = 1;
  Phase  phase    = 2;
  string detail   = 3;
}
enum Phase { PHASE_LAUNCHING = 0; PHASE_RUNNING = 1; PHASE_ENDED = 2; PHASE_FAILED = 3; }

// Lobby chat. The server stamps the author and the time - a client cannot
// speak as somebody else.
message ChatSend {
  ChatScope scope = 1;
  string    text  = 2;
}
enum ChatScope {
  CHAT_GLOBAL = 0;   // everyone connected
  CHAT_ROOM   = 1;   // only the game room the sender is in
}

message Ping {
  int64 t      = 1;
  int32 rtt_ms = 2;   // RTT we measured on the PREVIOUS ping, reported back so
                      // the server can publish it in the roster
}

// ---------------------------------------------------------------------------
// server -> client
// ---------------------------------------------------------------------------
message ServerMsg {
  oneof kind {
    Welcome         welcome          = 1;
    LoginRejected   login_rejected   = 2;
    Roster          roster           = 3;
    ChallengeIn     challenge_in     = 4;
    ChallengeResult challenge_result = 5;
    MatchStart      match_start      = 6;
    MatchAborted    match_aborted    = 7;
    Pong            pong             = 8;
    ServerError     error            = 9;
    ChatMsg         chat             = 10;
    ChatLog         chat_log         = 11;
    MatchList       matches          = 12;
  }
}

message Welcome {
  string user_id    = 1;   // server-assigned session id
  string username   = 2;
  int32  relay_port = 3;   // tcp port of the spectator relay on THIS host, 0 = off
}
message LoginRejected { string reason = 1; }

enum PlayerState {
  PLAYER_IDLE        = 0;
  PLAYER_IN_ROOM     = 1;
  PLAYER_CHALLENGING = 2;
  PLAYER_IN_MATCH    = 3;
}
message Player {
  string      user_id  = 1;
  string      username = 2;
  string      game     = 3;   // room short name, "" if none
  PlayerState state    = 4;
  int32       ping_ms  = 5;   // round trip to THIS server, 0 = not measured yet
}
message Roster {
  repeated Player players = 1;
  int32           epoch   = 2;
}

message ChallengeIn {
  string challenge_id = 1;
  string from_user_id = 2;
  string from_username = 3;
  string game         = 4;
  int32  from_frame_delay = 5;   // what the challenger asked for
  int32  suggested_delay  = 6;   // server\x27s suggestion from both pings
}
message ChallengeResult {
  string  challenge_id  = 1;
  Outcome outcome       = 2;
  string  peer_username = 3;
}
enum Outcome { OUTCOME_ACCEPTED = 0; OUTCOME_DECLINED = 1; OUTCOME_EXPIRED = 2; OUTCOME_CANCELLED = 3; }

// Sent to BOTH peers when a challenge is accepted. Each side gets its own view
// (player_num, local_port, peer_ip, peer_port) ready to hand to fbneo.exe.
message MatchStart {
  string match_id      = 1;
  string game          = 2;
  int32  player_num    = 3;   // 1 or 2 - this client's side
  string local_bind    = 4;   // "0.0.0.0"
  int32  local_port    = 5;
  string peer_ip       = 6;
  int32  peer_port     = 7;
  int32  frame_delay   = 8;
  string peer_username = 9;

  // NAT hole punching: the peers announce themselves at <lobby host>:punch_port
  // from the very UDP port libggpo will bind, and the rendezvous hands each the
  // other's PUBLIC endpoint. 0 disables it (LAN / port-forwarded setups).
  int32  punch_port    = 10;

  // Where the game traffic goes when the rendezvous decides the pair cannot be
  // punched (a carrier NAT that remaps per destination). udp, same host. 0 = off.
  int32  game_relay_port = 11;
}
message MatchAborted { string match_id = 1; string reason = 2; }

message Pong { int64 t = 1; }
message ServerError { string message = 1; }

// ---------------------------------------------------------------------------
// chat
// ---------------------------------------------------------------------------
// user_id "" marks a server notice ("fulano entrou na sala") - the launcher
// renders those in a dimmer style and without a name.
message ChatMsg {
  ChatScope scope    = 1;
  string    room     = 2;   // game short name when scope = CHAT_ROOM
  string    user_id  = 3;
  string    username = 4;
  string    text     = 5;
  int64     t        = 6;   // unix milliseconds, server clock
}

// Backlog handed out on login (global) and on joining a room. Lets a player who
// just arrived read what was being said instead of an empty box.
message ChatLog {
  ChatScope        scope    = 1;
  string           room     = 2;
  repeated ChatMsg messages = 3;
}

// ---------------------------------------------------------------------------
// who is playing whom
// ---------------------------------------------------------------------------
message LiveMatch {
  string match_id     = 1;
  string game         = 2;
  string p1_user_id   = 3;
  string p1_username  = 4;
  string p2_user_id   = 5;
  string p2_username  = 6;
  int64  started_t    = 7;   // unix milliseconds, server clock
  int32  frame_delay  = 8;
  int32  ping_ms      = 9;   // estimated round trip between the two players
  bool   watchable    = 10;  // the host is relaying inputs, so it can be watched
  int32  viewers      = 11;
}
message MatchList {
  repeated LiveMatch matches = 1;
  int32              epoch   = 2;
}
